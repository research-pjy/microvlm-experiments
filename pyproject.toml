[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microvlm"
version = "0.1.0"
description = "Iteration-0 scaffolding for NanoVLM reproduction and follow-up experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jayanth" }]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=10.0",
    "requests>=2.31",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
microvlm-generate = "microvlm.cli.generate_data:main"
microvlm-train = "microvlm.cli.train:main"
microvlm-evaluate = "microvlm.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end smoke that may skip without fixture/Ollama",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
